apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      username: $CLICKHOUSE_USER
      defaultDatabase: $CLICKHOUSE_DATABASE
      dialTimeout: 10
      queryTimeout: 60
      validateSql: false
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD
